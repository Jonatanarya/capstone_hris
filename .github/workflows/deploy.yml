name: Deploy Vercel
on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.ENABLE_VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done
      - run: npm ci
      - run: npx --yes vercel@62.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@62.2.0 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@62.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
